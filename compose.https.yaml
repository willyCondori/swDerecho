# Despliegue con certificado TLS propio. No modifica el HTTP local de Compose.
services:
  backend:
    environment:
      DEPLOY_HTTPS: 'True'
      DEBUG: 'False'
      COOKIE_SECURE: 'True'
      ALLOWED_HOSTS: ${DEPLOY_DOMAIN:?Configura DEPLOY_DOMAIN},backend,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: https://${DEPLOY_DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DEPLOY_DOMAIN}
  frontend:
    ports: !override
      - '${HTTPS_BIND_IP:-127.0.0.1}:80:80'
      - '${HTTPS_BIND_IP:-127.0.0.1}:443:443'
    volumes:
      - ./frontend/docker/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Configura TLS_CERT_DIR}:/etc/nginx/certs:ro
