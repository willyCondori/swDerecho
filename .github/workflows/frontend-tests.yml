name: Frontend tests

# Corre los tests del frontend (vitest) y comprueba que compile, en cada push
# y cada Pull Request contra develop o main que toque el frontend.
on:
  push:
    branches: [develop, main]
    paths: ["frontend/**", ".github/workflows/frontend-tests.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["frontend/**", ".github/workflows/frontend-tests.yml"]

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
