server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    # Resolver de Docker: volver a localizar el backend si cambia de IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $backend_upstream backend:8000;

    # PDF.js carga su worker como módulo ES; el navegador rechaza octet-stream.
    location ~ ^/assets/.+\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location /ws/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location = /health/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
    }
    location /static/ { alias /srv/static/; }
    # Los documentos se sirven únicamente por la API autenticada.
    location /media/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
