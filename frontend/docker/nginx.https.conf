# Limite IP adicional: memoria compartida por los workers de Nginx.
limit_req_zone $binary_remote_addr zone=auth_requests:10m rate=10r/m;
limit_req_status 429;

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    # Resolver de Docker: volver a localizar el backend si cambia de IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $backend_upstream backend:8000;

    # PDF.js carga su worker como módulo ES; el navegador rechaza octet-stream.
    location ~ ^/assets/.+\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location /ws/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location ~ ^/api/usuarios/auth/(login|recuperar-password(/confirmar)?)/$ {
        limit_req zone=auth_requests burst=10 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location = /health/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
    }
    location /static/ { alias /srv/static/; }
    # Los documentos se sirven únicamente por la API autenticada.
    location /media/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name _;
    location = /health/ { return 200 "ok"; }
    location / { return 308 https://$host$request_uri; }
}
